name: Daily Agents Radar

on:
  schedule:
    # 每天 00:00 UTC = 08:00 CST (UTC+8)
    - cron: "0 0 * * 1,3,5"
  workflow_dispatch:

concurrency:
  group: daily-digest
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute report date (Asia/Shanghai)
        id: date
        run: echo "REPORT_DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Run daily digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PROVIDER: openai
          OPENAI_API_KEY: ${{ secrets.MIMO_API_KEY }}
          OPENAI_BASE_URL: https://token-plan-cn.xiaomimimo.com/v1
          OPENAI_MODEL: mimo-v2.5
          LANGUAGES: zh
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
        run: pnpm start

      - name: Commit digest files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          if git diff --cached --quiet; then
            echo "No new digest files to commit"
          else
            git commit -m "digest: ${{ steps.date.outputs.REPORT_DATE }} daily digest"
            git pull --rebase
            git push
          fi

      - name: Update web manifest
        run: pnpm manifest

      - name: Commit manifest and feed
        run: |
          git add manifest.json feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: update manifest.json"
            git pull --rebase
            git push
          fi

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '@agents_radar' }}
          PAGES_URL: https://1535385491.github.io/Opportunity-Radar
          REPORT_DATE: ${{ steps.date.outputs.REPORT_DATE }}
        run: pnpm notify

      - name: Send Feishu notification
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          PAGES_URL: https://1535385491.github.io/Opportunity-Radar
          REPORT_DATE: ${{ steps.date.outputs.REPORT_DATE }}
        run: pnpm notify:feishu

      - name: Persist notification state
        if: always()
        run: |
          if [ ! -f digests/notification-state.json ]; then
            echo "No notification state file to persist — skipping."
            exit 0
          fi
          git add digests/notification-state.json
          if git diff --cached --quiet; then
            echo "Notification state unchanged — skipping commit."
            exit 0
          fi
          git commit -m "chore: persist notification state"
          git pull --rebase
          git push
